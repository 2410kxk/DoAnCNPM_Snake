<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="container header-content">
        <div class="logo">Drug Safe</div>
        <nav class="nav">
            <a href="index.html">Trang chủ</a>
            <a href="check.html">Kiểm tra</a>
            <a href="register.html">Đăng ký</a>
        </nav>
    </div>
</header>

<div class="container">
    <div class="form-box">
        <h2>Đăng nhập</h2>

        <div id="loginMessage" class="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-control" placeholder="Nhập email">
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu">
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%">Đăng nhập</button>
        </form>

        <p style="text-align:center; margin-top:16px;">
            Chưa có tài khoản? <a href="register.html" style="color:#0f766e;">Đăng ký</a>
        </p>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/login.js"></script>

</body>
</html>
