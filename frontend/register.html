<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="container header-content">
        <div class="logo">Drug Safe</div>
        <nav class="nav">
            <a href="index.html">Trang chủ</a>
            <a href="check.html">Kiểm tra</a>
            <a href="login.html">Đăng nhập</a>
        </nav>
    </div>
</header>

<div class="container">
    <div class="form-box">
        <h2>Đăng ký tài khoản</h2>

        <div id="registerMessage" class="message"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>Họ tên</label>
                <input type="text" id="fullName" class="form-control" placeholder="Nhập họ tên">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-control" placeholder="Nhập email">
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu">
            </div>

            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu">
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%">Đăng ký</button>
        </form>

        <p style="text-align:center; margin-top:16px;">
            Đã có tài khoản? <a href="login.html" style="color:#0f766e;">Đăng nhập</a>
        </p>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/register.js"></script>

</body>
</html>
